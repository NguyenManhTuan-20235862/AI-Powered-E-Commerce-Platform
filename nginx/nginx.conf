# nginx.conf — reverse proxy routing FE/BE (task 2.4.1).
#
# Route toàn bộ traffic qua 1 port DUY NHẤT (80) thay vì người dùng phải biết
# 2 port riêng (3000 Frontend, 8000 Backend) - Frontend và Backend chạy ở 2
# container khác nhau (`frontend`, `backend` - tên service trong
# docker-compose.yml), nginx đứng giữa quyết định request nào đi đâu dựa vào
# path.
#
# QUAN TRỌNG: đã kiểm tra thật `backend/app/main.py` (KHÔNG suy đoán từ
# docs/API_SPEC.md) - `API_PREFIX = "/api/v1"` được gắn qua
# `app.include_router(..., prefix=API_PREFIX)` cho TẤT CẢ router, kể cả
# `ai_chat.router` (chứa WebSocket `/ws/chat`) và `notification.router`
# (chứa 2 SSE endpoint `/notifications/*/stream`) - 2 router này KHÔNG được
# include riêng ngoài API_PREFIX. Nghĩa là path THẬT SỰ đang chạy là:
#   /api/v1/ws/chat                  (KHÔNG PHẢI /ws/chat trơ)
#   /api/v1/notifications/orders/stream    (KHÔNG PHẢI /notifications/orders/stream trơ)
#   /api/v1/notifications/admin/stream
# Khớp đúng với "Base URL (dev): http://localhost:8000/api/v1" đã ghi ở đầu
# docs/API_SPEC.md - cột "Path" trong từng bảng liệt kê phần ĐUÔI sau base
# URL, không phải path tuyệt đối. Toàn bộ location block dưới đây route theo
# path THẬT (có /api/v1 ở đầu), không phải theo cách đọc lướt cột Path.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Giới hạn mặc định của nginx (1MB) quá nhỏ cho e-commerce (upload ảnh sản
    # phẩm/avatar sau này, python-multipart đã có sẵn trong requirements-core.txt
    # dù chưa có route upload thật) - nới lên 10MB, điều chỉnh lại khi có route
    # upload thật với giới hạn cụ thể hơn.
    client_max_body_size 10m;

    # upstream: đặt tên logic cho từng service - dùng tên service Docker Compose
    # (`backend`, `frontend`) làm hostname, resolve qua DNS nội bộ của Compose
    # network (giống Backend resolve `mysql`/`mongodb`/`redis` ở task 2.3.4).
    # Địa chỉ được resolve 1 LẦN lúc nginx khởi động (static upstream, không
    # dùng resolver + biến để re-resolve động) - ĐỦ cho dev (container ít khi
    # đổi IP giữa chừng nếu không recreate) nhưng LƯU Ý: nếu `docker compose up
    # --build backend` recreate container backend giữa lúc nginx đang chạy,
    # nginx vẫn giữ IP CŨ (cache tại thời điểm start) -> phải
    # `docker compose restart nginx` sau khi recreate backend/frontend để nginx
    # resolve lại IP mới. Không phải vấn đề của riêng task này - ghi chú lại vì
    # sẽ gặp trong dev hàng ngày khi dùng `docker compose up --build`.
    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # map chuẩn của nginx cho WebSocket proxying (khuyến nghị chính thức từ
    # nginx.org/en/docs/http/websocket.html) - quyết định giá trị header
    # "Connection" gửi tới upstream dựa vào header "Upgrade" client gửi lên:
    # có Upgrade (VD "websocket") -> "upgrade"; KHÔNG có (request HTTP thường)
    # -> "close". Cần cho CẢ /api/v1/ws/ (WebSocket thật) LẪN location "/"
    # (Next.js dev server dùng WebSocket riêng cho HMR/Fast Refresh ở
    # /_next/webpack-hmr - nếu nginx đứng giữa mà thiếu Upgrade header, hot-reload
    # sẽ ngừng hoạt động dù trang vẫn load bình thường qua HTTP).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Header chuẩn cho MỌI location - Backend/Frontend cần các header này để
        # biết IP thật của client (không phải IP nội bộ của nginx trong network
        # Docker) và scheme gốc (http/https) - quan trọng cho CORS/redirect/log
        # đúng, và cho việc sau này bật HTTPS ở nginx (task 7.x) mà Backend vẫn
        # biết request gốc là https dù nginx->backend nội bộ luôn là http.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # ---- WebSocket: /api/v1/ws/ (task 5.1, /ws/chat - chưa có logic thật) ----
        # Location RIÊNG, tách khỏi /api/ chung phía dưới, dù nginx tự chọn
        # prefix DÀI NHẤT khớp bất kể thứ tự khai báo trong file (không bắt buộc
        # phải đặt trước /api/ để "thắng") - tách riêng vì cần bộ header khác hẳn
        # (Upgrade/Connection) và timeout khác (kết nối dài hạn) so với REST
        # thường, không phải vì thứ tự.
        location /api/v1/ws/ {
            proxy_pass http://backend_upstream;

            # Bắt buộc để nâng cấp giao thức đúng chuẩn: HTTP handshake ban đầu
            # của WebSocket dùng header "Upgrade: websocket" + "Connection: Upgrade"
            # - nginx KHÔNG tự forward 2 header này lên upstream theo mặc định (đây
            # là "hop-by-hop header" theo chuẩn HTTP, nginx coi kết nối nginx<->backend
            # là 1 kết nối HTTP RIÊNG BIỆT với kết nối client<->nginx, không tự
            # copy nguyên văn). Thiếu 2 dòng dưới: backend (Starlette/uvicorn) nhận
            # được 1 request HTTP GET bình thường (không phải upgrade request) -
            # route `@router.websocket(...)` không khớp -> handshake thất bại,
            # KHÔNG có lỗi rõ ràng phía client ngoài "kết nối đóng ngay" hoặc rơi về
            # xử lý như HTTP thường tùy implementation - rất khó debug nếu không biết
            # nguyên nhân là thiếu header, vì trông giống lỗi logic ứng dụng.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # proxy_http_version 1.1 (đã set ở server block) CŨNG bắt buộc cho
            # WebSocket - cơ chế Upgrade là tính năng của HTTP/1.1, nginx mặc định
            # dùng HTTP/1.0 cho kết nối tới upstream nếu không khai báo lại, mà
            # HTTP/1.0 không hỗ trợ Upgrade -> handshake thất bại dù đã có đủ header
            # Upgrade/Connection ở trên.

            # nginx mặc định proxy_read_timeout 60s - đóng kết nối nếu KHÔNG có dữ
            # liệu mới trong 60s. WebSocket chat thường idle (chờ tin nhắn) lâu hơn
            # nhiều - nếu không nới, kết nối tự đóng ÂM THẦM sau 60s dù cả client
            # lẫn backend đều nghĩ kết nối vẫn sống (không có lỗi tường minh, chỉ là
            # 1 lúc nào đó tin nhắn không gửi được nữa) - nới lên 1h, đủ dài cho phiên
            # chat thông thường.
            proxy_read_timeout 3600s;
        }

        # ---- SSE: /api/v1/notifications/ (task 5.2/9.x - chưa có logic thật) ----
        location /api/v1/notifications/ {
            proxy_pass http://backend_upstream;

            # proxy_buffering off - MẤU CHỐT cho SSE: mặc định nginx đọc TOÀN BỘ
            # response từ upstream vào buffer nội bộ trước khi bắt đầu gửi cho
            # client (tối ưu cho response ngắn/tĩnh, không hợp với response
            # KHÔNG BAO GIỜ kết thúc như SSE) - nếu để mặc định, client sẽ không
            # nhận được event nào cho tới khi buffer đầy (proxy_buffer_size, mặc
            # định vài KB) hoặc kết nối đóng - với SSE (kết nối mở vô hạn, mỗi
            # event chỉ vài chục byte), điều này nghĩa là gần như KHÔNG BAO GIỜ
            # nhận được event nào theo thời gian thực, dữ liệu bị "giữ" vô thời hạn
            # phía nginx dù backend đã gửi đúng. Tắt hẳn để nginx forward ngay từng
            # chunk ngay khi nhận được từ backend.
            proxy_buffering off;
            # proxy_cache off - phòng khi sau này có cấu hình proxy_cache_path ở
            # scope http {} rộng hơn (chưa có ở file này) - đảm bảo riêng location
            # SSE KHÔNG BAO GIỜ bị cache dù cấu hình chung thay đổi (response SSE
            # là stream sự kiện realtime, cache sẽ trả event cũ/stale).
            proxy_cache off;

            # Cùng lý do timeout với WebSocket ở trên - kết nối SSE cũng mở dài hạn,
            # chờ event mới có thể lâu hơn 60s mặc định.
            proxy_read_timeout 3600s;
        }

        # ---- REST API: /api/ (mọi endpoint còn lại - auth, product, cart...) ----
        location /api/ {
            # KHÔNG có dấu "/" ở cuối URI đích (chỉ "http://backend_upstream", không
            # phải "http://backend_upstream/") - GIỮ NGUYÊN path gốc, không strip
            # "/api" - vì FastAPI đã tự đăng ký route với path đầy đủ CÓ "/api/v1"
            # (API_PREFIX, xem app/main.py) - nginx phải forward request tới
            # "/api/v1/auth/login" NGUYÊN VẸN thành "/api/v1/auth/login" phía
            # backend, không phải strip còn "/auth/login" (sẽ 404 vì backend không
            # có route ở path đó). Nếu sau này đổi cách backend đăng ký route thì
            # xem lại dòng này.
            proxy_pass http://backend_upstream;
        }

        # ---- Frontend: mọi path còn lại (/, /login, /products, /admin/...) ----
        location / {
            proxy_pass http://frontend_upstream;

            # Next.js dev server (`next dev`) dùng WebSocket riêng cho HMR/Fast
            # Refresh (path /_next/webpack-hmr) - cần Upgrade/Connection giống hệt
            # lý do đã giải thích ở location WebSocket của Backend, nếu không
            # hot-reload sẽ không hoạt động khi truy cập qua nginx (port 80) thay vì
            # thẳng port 3000. Không ảnh hưởng gì khi chạy Dockerfile.prod (không có
            # HMR trong production build) - giữ ở đây vì file này hiện phục vụ cả
            # 2 mục đích (xem giải thích cuối cùng gửi kèm ngoài file này).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
